# 예시 파일이다. 실제 값은 레포에 커밋하지 않고 클러스터에서 직접 만든다 (결정 I3).
#
#   kubectl create secret generic wilson-backend-secret \
#     --from-literal=DB_URL=jdbc:postgresql://<host>:5432/wilson \
#     --from-literal=DB_USERNAME=<user> \
#     --from-literal=DB_PASSWORD=<password> \
#     --from-literal=JWT_SECRET=<256비트 이상 임의 문자열>
#
#   kubectl create secret generic wilson-fcm --from-file=service-account.json=<FCM 서비스 계정 JSON 경로>
#
# TLS 인증서는 ACM에서 관리하므로 Secret으로 만들지 않는다 (결정 I4, ingress.yaml certificate-arn).
apiVersion: v1
kind: Secret
metadata:
  name: wilson-backend-secret
type: Opaque
stringData:
  DB_URL: jdbc:postgresql://postgres:5432/wilson
  DB_USERNAME: wilson
  DB_PASSWORD: change-me
  JWT_SECRET: change-me-to-a-random-string-of-at-least-256-bits
